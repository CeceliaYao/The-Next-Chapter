<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Next Chapter</title>
  <meta name="description" content="A pixel Y2K upkeep game about one bedroom, from nursery to moving out.">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- p5 canvas is inserted here -->
    <div id="hud" class="hidden">
      <button id="menuBtn" class="aqua small-btn" title="Menu (Esc)">MENU</button>
      <div class="hud-chapter"><span id="hudChapter">Chapter 1 · The Nursery</span></div>
      <div class="lcd hud-year" id="hudYear">2000</div>
      <div class="hud-meter">
        <span id="hudLabel">UPKEEP</span>
        <div class="bar"><i id="hudBar"></i></div>
        <b id="hudTidy">0/0</b>
      </div>
      <div class="hud-mem" id="hudMem" title="Memories found in this chapter">MEM 0/0</div>
      <button id="muteBtn" class="aqua small-btn round" title="Sound (M)">♪</button>
    </div>
    <div id="hint" class="hidden"></div>
    <div id="overlay"></div>
    <div id="modal"></div>
    <div id="toasts"></div>
  </div>
  <noscript>The Next Chapter needs JavaScript to run.</noscript>

  <script src="lib/p5.min.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/room.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
